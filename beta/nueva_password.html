<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Nueva contraseña</title>
<link rel="stylesheet" href="css/recuperar.css">
</head>

<body>

<div class="container">

<a href="#" class="back">← Volver a inicio de sesión</a>

<div class="steps">
    <div class="circle">✔</div>
    <div class="line"></div>
    <div class="circle gray">2</div>
</div>

<h2>Crea una nueva contraseña</h2>
<p>Ingresa el código que te enviamos a <b>wompi.pruebas@gmail.com</b> y crea tu nueva contraseña</p>

<!-- Código -->
<div class="code-container">
    <input type="text" maxlength="1">
    <input type="text" maxlength="1">
    <input type="text" maxlength="1">
    <input type="text" maxlength="1">
    <input type="text" maxlength="1">
    <input type="text" maxlength="1">
</div>

<!-- Password -->
<label>Contraseña</label>
<div class="input-group password">
    <input type="password" id="password">
    <span onclick="togglePassword()">👁</span>
</div>

<!-- Reglas -->
<div class="rules">
    <p id="rule1">❌ Tu contraseña debe tener:</p>
    <p id="rule2">❌ Al menos una minúscula y una mayúscula</p>
    <p id="rule3">❌ Mínimo 8 caracteres</p>
    <p id="rule4">❌ Al menos un número</p>
</div>

<button id="btn" disabled>Cambiar contraseña</button>

</div>

<script>
// Mostrar contraseña
function togglePassword() {
    const input = document.getElementById("password");
    input.type = input.type === "password" ? "text" : "password";
}

// Validación
const password = document.getElementById("password");
const btn = document.getElementById("btn");

password.addEventListener("input", () => {
    const val = password.value;

    const hasUpperLower = /(?=.*[a-z])(?=.*[A-Z])/.test(val);
    const hasLength = val.length >= 8;
    const hasNumber = /[0-9]/.test(val);

    // Cambiar colores
    document.getElementById("rule2").style.color = hasUpperLower ? "green" : "red";
    document.getElementById("rule3").style.color = hasLength ? "green" : "red";
    document.getElementById("rule4").style.color = hasNumber ? "green" : "red";

    // Borde input
    password.style.borderColor = (hasUpperLower && hasLength && hasNumber) ? "green" : "red";

    // Botón
    if (hasUpperLower && hasLength && hasNumber) {
        btn.disabled = false;
        btn.classList.add("active");
    } else {
        btn.disabled = true;
        btn.classList.remove("active");
    }
});

// Auto avanzar código
const inputs = document.querySelectorAll(".code-container input");

inputs.forEach((input, index) => {
    input.addEventListener("input", () => {
        if (input.value.length === 1 && index < inputs.length - 1) {
            inputs[index + 1].focus();
        }
    });
});
</script>

</body>
</html>
