<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>LAGMET Sistema</title>

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/login.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/tablas.css">
<link rel="stylesheet" href="css/botones.css">

<link rel="stylesheet" href="css/dashboard/dashboard-base.css">
<link rel="stylesheet" href="css/dashboard/dashboard-cards.css">
<link rel="stylesheet" href="css/dashboard/dashboard-charts.css">
<link rel="stylesheet" href="css/dashboard/dashboard-panels.css">
<link rel="stylesheet" href="css/dashboard/dashboard-table.css">
<link rel="stylesheet" href="css/dashboard/dashboard-dropdown.css">
<link rel="stylesheet" href="css/dashboard/monitoreo-base.css">
<link rel="stylesheet" href="css/dashboard/monitoreo-tabs.css">
<link rel="stylesheet" href="css/dashboard/monitoreo-form.css">
<link rel="stylesheet" href="css/dashboard/monitoreo-extra.css">
<link rel="stylesheet" href="css/dashboard/monitoreo-modal.css">
<link rel="stylesheet" href="css/dashboard/monitoreo-maquinas.css">
<link rel="stylesheet" href="css/dashboard/monitoreo-selects.css">
<link rel="stylesheet" href="css/dashboard/dashboard-responsive.css">

<link rel="stylesheet" href="css/documentacion.css">
<link rel="stylesheet" href="css/configuracion.css">
<link rel="stylesheet" href="css/responsive.css">

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="icon" href="img/logo-lagmet.png">
</head>

<body>

<!-- LOGIN -->
<div id="login" class="login">
<div class="login-box">
<h2>Login</h2>

<input type="email" id="email" placeholder="admin@gmail.com">
<input type="password" id="password" placeholder="••••••••">

<button onclick="login()">Ingresar</button>

<p class="forgot" onclick="mostrarRecuperar()">
¿Olvidaste tu contraseña?
</p>

<p id="error" style="color:red;"></p>
</div>
</div>

<!-- RECUPERAR -->
<div id="recuperar" class="login" style="display:none;">
<div class="login-box">

<h2>Recuperar contraseña</h2>

<!-- PASO 1 -->
<div id="paso1">
<input type="email" id="emailRec" placeholder="Correo">
<button id="btnEnviar" onclick="enviarCodigo()" disabled>Enviar código</button>
</div>

<!-- PASO 2 -->
<div id="paso2" style="display:none;">
<input type="text" id="codigo" placeholder="Código">
<button onclick="verificarCodigo()">Verificar</button>
</div>

<!-- PASO 3 -->
<div id="paso3" style="display:none;">
<input type="password" id="nuevaPass" placeholder="Nueva contraseña">
<button onclick="cambiarPasswordRecuperacion()">Guardar</button>
</div>

<p class="forgot" onclick="volverLogin()">Volver</p>

</div>
</div>

<!-- APP -->
<div id="app" style="display:none;">
<div class="container">

<div class="sidebar">

    <div class="sidebar-top">
        <div class="logo-sidebar">
            <img src="img/logo-lagmet.png" alt="Logo LAGMET">
        </div>

        <div class="menu">
            <button onclick="showSection('dashboard')">📊 Dashboard</button>
            <button onclick="showSection('monitoreo')">🏭 Monitoreo</button>
            <button onclick="showSection('productos')">📦 Productos</button>
            <button onclick="showSection('documentacion')">📄 Documentación</button>
            <button onclick="showSection('Flujo Proceso')">Flujo Proceso</button>
            <button onclick="showSection('Estados')">Estados</button>
            <button onclick="showSection('configuracion')">⚙️ Configuración</button>
        </div>
    </div>

    <div class="sidebar-bottom">
        <button class="logout" onclick="logout()">Cerrar sesión</button>
    </div>



</div>

<div class="content" id="contenido"></div>

</div>
</div>

<!-- LIBRERÍAS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<link rel="stylesheet" href="https://unpkg.com/frappe-gantt/dist/frappe-gantt.css">
<script src="https://unpkg.com/frappe-gantt/dist/frappe-gantt.umd.js"></script>

<!-- 🔥 NUEVA LIBRERÍA -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- JS DEL SISTEMA -->
<script src="js/auth.js"></script>
<script src="js/recuperacion.js"></script>
<script src="js/navigation.js"></script>
<script src="js/produccion.js"></script>
<script src="js/productos.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/gantt.js"></script>
<script src="js/pdf.js"></script>
<script src="js/main.js"></script>
<script src="js/configuracion.js"></script>

</body>
</html>
