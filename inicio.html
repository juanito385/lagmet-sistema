<!-- LOGIN -->
<div id="login" class="login">
<div class="login-box">
<h2>Login</h2>

<input type="email" id="email" placeholder="admin@gmail.com">
<input type="password" id="password" placeholder="••••••••">

<button onclick="login()">Ingresar</button>

<p class="forgot" onclick="mostrarRecuperar()">
¿Olvidaste tu contraseña?
</p>

<p id="error" style="color:red;"></p>
</div>
</div>

<!-- RECUPERAR -->
<div id="recuperar" class="login" style="display:none;">
<div class="login-box">

<h2>Recuperar contraseña</h2>

<!-- PASO 1 -->
<div id="paso1">
<input type="email" id="emailRec" placeholder="Correo">
<button id="btnEnviar" onclick="enviarCodigo()" disabled>Enviar código</button>
</div>

<!-- PASO 2 -->
<div id="paso2" style="display:none;">
<input type="text" id="codigo" placeholder="Código">
<button onclick="verificarCodigo()">Verificar</button>
</div>

<!-- PASO 3 -->
<div id="paso3" style="display:none;">
<input type="password" id="nuevaPass" placeholder="Nueva contraseña">
<button onclick="cambiarPasswordRecuperacion()">Guardar</button>
</div>

<p class="forgot" onclick="volverLogin()">Volver</p>

    <div class="sidebar-bottom">
        <button class="logout" onclick="logout()">Cerrar sesión</button>
    </div>



</div>

<script>
let emailRecuperacion = "";

/* MOSTRAR RECUPERAR */
function mostrarRecuperar(){
    document.getElementById("login").style.display = "none";
    document.getElementById("recuperar").style.display = "flex";
}

/* VOLVER */
function volverLogin(){
    document.getElementById("recuperar").style.display = "none";
    document.getElementById("login").style.display = "flex";

    // reset visual
    document.getElementById("paso1").style.display="block";
    document.getElementById("paso2").style.display="none";
    document.getElementById("paso3").style.display="none";

    document.getElementById("emailRec").value="";
    document.getElementById("codigo").value="";
    document.getElementById("nuevaPass").value="";
}

/* ACTIVAR BOTÓN */
document.addEventListener("input", e=>{
    if(e.target.id === "emailRec"){
        const val = e.target.value;
        const btn = document.getElementById("btnEnviar");

        if(val.includes("@")){
            btn.disabled = false;
            btn.classList.add("active");
        }else{
            btn.disabled = true;
            btn.classList.remove("active");
        }
    }
});

/* PASO 1 */
async function enviarCodigo(){
    const email = document.getElementById("emailRec").value;

    const res = await fetch("php/enviar_codigo.php",{
        method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:`email=${email}`
    });

    const data = await res.json();

    if(data.success){
        emailRecuperacion = email;
        document.getElementById("paso1").style.display="none";
        document.getElementById("paso2").style.display="block";
    }else{
        alert("Correo no encontrado");
    }
}

/* PASO 2 */
async function verificarCodigo(){
    const codigo = document.getElementById("codigo").value;

    const res = await fetch("php/verificar_codigo.php",{
        method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:`email=${emailRecuperacion}&codigo=${codigo}`
    });

    const data = await res.json();

    if(data.success){
        document.getElementById("paso2").style.display="none";
        document.getElementById("paso3").style.display="block";
    }else{
        alert("Código incorrecto");
    }
}

/* PASO 3 */
async function cambiarPasswordRecuperacion(){
    const pass = document.getElementById("nuevaPass").value;

    const res = await fetch("php/recuperar_password_confirmar.php",{
        method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:`email=${emailRecuperacion}&password=${pass}`
    });

    const data = await res.json();

    if(data.success){
        alert("Contraseña actualizada");
        volverLogin();
    } else {
        alert(data.message || "Error al actualizar");
    }
}
</script>

</body>
