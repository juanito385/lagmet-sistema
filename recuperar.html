<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Recuperar contraseña</title>

<link rel="stylesheet" href="css/recuperar.css">
</head>

<body>

<div class="container">

    <a href="login.html" class="back">← Volver a inicio de sesión</a>

    <div class="steps">
        <div class="circle active">1</div>
        <div class="line"></div>
        <div class="circle">2</div>
    </div>

    <h2>Recupera tu contraseña</h2>
    <p>Ingresa el correo registrado para enviarte un código de verificación</p>

    <label>Correo electrónico</label>
    <div class="input-group">
        <span>👤</span>
        <input type="email" id="correo" placeholder="ejemplo@gmail.com">
    </div>

    <button id="btn" disabled>Enviar código</button>

</div>

<script>
    const input = document.getElementById("correo");
    const btn = document.getElementById("btn");

    input.addEventListener("input", () => {
        const valor = input.value.trim();

        if (valor.endsWith("@gmail.com")) {
            btn.disabled = false;
            btn.classList.add("active");
        } else {
            btn.disabled = true;
            btn.classList.remove("active");
        }
    });
</script>

</body>
</html>
