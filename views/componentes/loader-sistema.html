<!-- ===============================
     PANTALLA DE CARGA SISTEMA IRONIX
================================ -->
<div id="ironixLoaderSistema" class="ironix-loader-sistema oculto">

    <div class="ironix-loader-hud ironix-loader-hud-top-left">
        <span>SYSTEM INIT</span>
        <small>● ● ●</small>
    </div>

    <div class="ironix-loader-hud ironix-loader-hud-bottom-left">
        <span>IRONIX SYSTEM v2.4.0</span>
    </div>

    <div class="ironix-loader-hud ironix-loader-hud-bottom-right">
        <span id="ironixLoaderEstadoFooter">Conectando componentes...</span>
    </div>

    <div class="ironix-loader-contenido">

        <div class="ironix-loader-brand">
            <h1>IRONIX</h1>
            <p>Industrial Monitoring &amp; Production Control System</p>
        </div>

        <div class="ironix-loader-spinner">
            <div class="ironix-loader-spinner-inner"></div>
        </div>

        <h2 id="ironixLoaderTitulo">Inicializando sistema</h2>

        <p id="ironixLoaderTexto">
            Preparando entorno de trabajo...
        </p>

        <div class="ironix-loader-progreso-wrapper">
            <div class="ironix-loader-progreso-barra">
                <div id="ironixLoaderProgreso" class="ironix-loader-progreso"></div>
            </div>

            <span id="ironixLoaderPorcentaje">0%</span>
        </div>

        <div class="ironix-loader-pasos">

            <div class="ironix-loader-paso active" id="loaderPasoSesion">
                <span class="loader-paso-icono"></span>
                <strong>Validando sesión</strong>
                <em>En progreso</em>
            </div>

            <div class="ironix-loader-paso" id="loaderPasoDashboard">
                <span class="loader-paso-icono"></span>
                <strong>Cargando Dashboard</strong>
                <em>Pendiente</em>
            </div>

            <div class="ironix-loader-paso" id="loaderPasoModulos">
                <span class="loader-paso-icono"></span>
                <strong>Sincronizando módulos</strong>
                <em>Pendiente</em>
            </div>

            <div class="ironix-loader-paso" id="loaderPasoListo">
                <span class="loader-paso-icono"></span>
                <strong>Sistema listo</strong>
                <em>Pendiente</em>
            </div>

        </div>

    </div>

</div>
